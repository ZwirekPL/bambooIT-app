# ─────────────────────────────────────────────────────────────────────────────
# bambooit.pl — server block to APPEND into e-dietetyk's nginx config
# (/opt/dietetyk/nginx/prod.conf, mounted into the dietetyk_nginx container as
#  a SINGLE FILE → /etc/nginx/conf.d/default.conf).
#
# This is the CANONICAL copy kept in the bambooIT repo so it survives an
# e-dietetyk redeploy that might rewrite prod.conf — just re-append from here.
#
# Routing model: everything for bambooit.pl → the bambooit_web container
# (Next.js), which proxies /api/proxy/* to the backend internally over bambooIT's
# own network. dietetyk_nginx reaches bambooit_web by name because bambooit_web
# is attached to the dietetyk_default network (see docker-compose.prod.yml).
#
# ⚠️  SINGLE-FILE BIND-MOUNT GOTCHA (cost us an outage during the first deploy):
#   prod.conf is mounted as ONE FILE. `sed -i` and `cp` REPLACE the inode
#   (write temp + rename), which SILENTLY DETACHES the running container from
#   the file — `nginx -s reload` then keeps reading the stale, orphaned inode
#   while `tail prod.conf` shows your new content. Symptoms: edits "don't take".
#   Safe edits:
#     • append-only with `>>` (preserves inode), OR
#     • after any in-place rewrite, `docker restart dietetyk_nginx` so Docker
#       re-binds the mount to the current inode.
#   ALWAYS validate first (without touching the live container) by running a
#   throwaway nginx ON the docker network so upstream names resolve:
#     docker run --rm --network dietetyk_default \
#       -v /opt/dietetyk/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro \
#       -v /etc/letsencrypt:/etc/letsencrypt:ro \
#       nginx:alpine nginx -t
#
# Cert issued via webroot (DNS must already point at the VPS):
#   certbot certonly --webroot -w /var/www/certbot -d bambooit.pl \
#     --non-interactive --agree-tos -m <email> --no-eff-email
# ─────────────────────────────────────────────────────────────────────────────

# ── bambooit.pl — HTTP→HTTPS redirect + ACME challenge ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bambooit.pl www.bambooit.pl;

    # Let's Encrypt webroot challenge (shared volume with e-dietetyk).
    # Kept on :80 so certbot auto-renew can revalidate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bambooit.pl$request_uri;
    }
}

# ── bambooit.pl — HTTPS ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bambooit.pl www.bambooit.pl;

    ssl_certificate     /etc/letsencrypt/live/bambooit.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bambooit.pl/privkey.pem;

    client_max_body_size 10M;

    # www → apex
    if ($host = www.bambooit.pl) { return 301 https://bambooit.pl$request_uri; }

    location / {
        proxy_pass http://bambooit_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Stripe webhook (when payments are enabled) → backend directly:
    # location /webhooks/ {
    #     proxy_pass http://bambooit_backend:4000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
}
