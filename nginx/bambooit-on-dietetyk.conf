# ─────────────────────────────────────────────────────────────────────────────
# bambooit.pl — server block to APPEND into e-dietetyk's nginx config
# (/opt/dietetyk/nginx/prod.conf, mounted into the dietetyk_nginx container).
#
# This is the CANONICAL copy kept in the bambooIT repo so it survives an
# e-dietetyk redeploy that might rewrite prod.conf — just re-append from here.
#
# Routing model: everything for bambooit.pl → the bambooit_web container
# (Next.js), which proxies /api/proxy/* to the backend internally over bambooIT's
# own network. dietetyk_nginx reaches bambooit_web by name because bambooit_web
# is attached to the dietetyk_default network (see docker-compose.prod.yml).
#
# Two-phase install (cert chicken-and-egg) — see DEPLOY_VPS_SHARED.md §6:
#   Phase A: append only the :80 block below, reload, run certbot (webroot).
#   Phase B: uncomment the :443 block + the HTTP→HTTPS redirect, reload.
# ─────────────────────────────────────────────────────────────────────────────

# ── Phase A: HTTP (also serves ACME challenge for certbot) ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bambooit.pl www.bambooit.pl;

    # Let's Encrypt webroot challenge (shared volume with e-dietetyk).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # PHASE A ONLY — temporary plain-HTTP proxy so the site works before SSL.
    # Comment this `location /` out once Phase B (the :443 block) is live, and
    # replace with the redirect below.
    location / {
        proxy_pass http://bambooit_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # PHASE B — after the cert exists, swap the `location /` above for this:
    # location / { return 301 https://bambooit.pl$request_uri; }
}

