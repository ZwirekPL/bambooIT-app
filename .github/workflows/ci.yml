name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Build shared database package ─────────────────────────────────────────
  database-build:
    name: Build database package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @db package
        run: cd packages/database && npm run build

      - name: Upload database dist
        uses: actions/upload-artifact@v4
        with:
          name: db-dist
          path: packages/database/dist
          retention-days: 1

  # ── Backend: type-check + unit tests ──────────────────────────────────────
  backend-check:
    name: Backend — build & test
    runs-on: ubuntu-latest
    needs: database-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download database dist
        uses: actions/download-artifact@v4
        with:
          name: db-dist
          path: packages/database/dist

      - name: TypeScript build
        run: cd apps/backend && npm run build

      - name: Run unit tests
        run: cd apps/backend && npm run test

  # ── Frontend: lint + type-check + unit tests ──────────────────────────────
  frontend-check:
    name: Frontend — lint, type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: cd apps/web && npm run lint

      - name: Type-check
        run: cd apps/web && npm run type-check

      - name: Unit tests
        run: cd apps/web && npm run test

  # ── Frontend: E2E tests (Playwright) ──────────────────────────────────────
  e2e:
    name: Frontend — E2E tests
    runs-on: ubuntu-latest
    needs: frontend-check
    env:
      AUTH_SECRET: ci-secret-placeholder-32chars-long
      NEXT_PUBLIC_API_URL: http://localhost:4000
      AUTH_URL: http://localhost:3000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd apps/web && npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # ── Smoke Tests: API + Solver (TS + Python unit) ──────────────────────────
  smoke-tests:
    name: Smoke Tests — API & Solver
    runs-on: ubuntu-latest
    needs: database-build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dietetyk
          POSTGRES_PASSWORD: dietetyk_test
          POSTGRES_DB: dietetyk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dietetyk -d dietetyk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dietetyk:dietetyk_test@localhost:5432/dietetyk_test?schema=public
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_SECRET: smoke-ci-jwt-secret-not-for-production-only
      CORS_ORIGIN: http://localhost:3000
      PORT: "4000"
      REDIS_URL: redis://localhost:6379
      API_URL: http://localhost:4000
      SOLVER_URL: http://localhost:5050
      SMOKE_DIETITIAN_EMAIL: smoke-dietetyk@test.pl
      SMOKE_DIETITIAN_PASSWORD: SmokeTest1234!
      SMOKE_PATIENT_EMAIL: smoke-pacjent@test.pl
      SMOKE_PATIENT_PASSWORD: SmokeTest1234!

    steps:
      - uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Download database dist
        uses: actions/download-artifact@v4
        with:
          name: db-dist
          path: packages/database/dist

      # ── Python (solver unit tests + run solver) ───────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/solver/requirements.txt

      - name: Install solver Python dependencies
        run: pip install -r apps/solver/requirements.txt pytest pytest-asyncio httpx

      # ── Solver Python unit tests (no server needed) ───────────────
      - name: Run solver Python unit tests
        run: pytest apps/solver/tests/test_solver.py -v -m unit --tb=short -q

      # ── DB: migrate + seed ────────────────────────────────────────
      - name: Run database migrations
        run: cd packages/database && npx prisma migrate deploy

      - name: Seed smoke fixtures
        run: node scripts/seed-smoke-fixtures.js

      # ── Start solver (Python uvicorn) ─────────────────────────────
      - name: Start solver service
        run: |
          cd apps/solver
          PYTHONUTF8=1 uvicorn main:app --host 0.0.0.0 --port 5050 &
          echo "Waiting for solver..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:5050/health && echo "Solver ready" && break
            sleep 2
          done

      # ── Build + start API ─────────────────────────────────────────
      - name: Build backend
        run: cd apps/backend && npm run build

      - name: Start API server
        run: |
          cd apps/backend
          node dist/server.js &
          echo "Waiting for API..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:4000/health && echo "API ready" && break
            sleep 2
          done

      # ── Smoke tests (Vitest) ──────────────────────────────────────
      - name: Run API smoke tests
        run: npm run test:smoke:api

      - name: Run solver TS smoke tests
        run: npm run test:smoke:solver

      # ── Artifacts on failure ──────────────────────────────────────
      - name: Upload solver logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: |
            apps/backend/dist
          retention-days: 3
