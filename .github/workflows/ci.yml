name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref (PR push race protection)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build the shared @db package first; backend + web depend on its dist
  database-build:
    name: Database — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=database

      - name: Build @db package
        run: npm run build --workspace=database

      - name: Upload database dist
        uses: actions/upload-artifact@v4
        with:
          name: db-dist
          path: packages/database/dist
          retention-days: 1

  # ── Backend: build + unit tests
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    needs: database-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=database

      - name: Download database dist
        uses: actions/download-artifact@v4
        with:
          name: db-dist
          path: packages/database/dist

      - name: TypeScript build
        run: npm run build --workspace=backend

      - name: Unit tests
        run: npm run test --workspace=backend

  # ── Frontend: type-check + unit tests + production build
  web:
    name: Frontend — type-check, test, build
    runs-on: ubuntu-latest
    needs: database-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=database

      - name: Download database dist
        uses: actions/download-artifact@v4
        with:
          name: db-dist
          path: packages/database/dist

      - name: Type-check
        run: npm run type-check --workspace=web

      - name: Unit tests
        run: npm run test --workspace=web

      - name: Production build
        run: npm run build --workspace=web
        env:
          # Build needs *some* value here so Next.js doesn't bail at build time;
          # real value comes from VPS .env at runtime.
          NEXT_PUBLIC_API_URL: http://localhost:4000
