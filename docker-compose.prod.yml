# Default logging for all services — prevent unbounded log growth
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bambooit_postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bambooit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bambooit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bambooit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Cache ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bambooit_redis
    restart: always
    logging: *default-logging
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: bambooit_backend
    restart: always
    logging: *default-logging
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bambooit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bambooit_db}?schema=public
      REDIS_URL: redis://redis:6379
      BLOG_IMAGES_DIR: /app/shared/blog/images
    volumes:
      - blog_images:/app/shared/blog/images
    expose:
      - "4000"
    # Shared VPS: publish on loopback so e-dietetyk's host reverse proxy can
    # reach the backend (e.g. /webhooks) without exposing it to the internet.
    ports:
      - "127.0.0.1:4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: bambooit_web
    restart: always
    logging: *default-logging
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - blog_images:/app/apps/web/public/blog/images
    expose:
      - "3000"
    # Shared VPS: host reverse proxy (e-dietetyk's) forwards bambooit.pl here.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Encrypted daily backup ─────────────────────────────────────────────────
  backup:
    build:
      context: scripts/backup
      dockerfile: Dockerfile
    container_name: bambooit_backup
    restart: always
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bambooit}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bambooit_db}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  # SHARED VPS: this binds host 80/443 and WOULD COLLIDE with e-dietetyk's proxy.
  # It is gated behind the "standalone-proxy" profile, so it does NOT start by
  # default. On the shared host, e-dietetyk's existing reverse proxy forwards
  # bambooit.pl → 127.0.0.1:3001 (web). Run with `--profile standalone-proxy`
  # ONLY on a dedicated VPS where bambooIT owns ports 80/443.
  nginx:
    image: nginx:alpine
    container_name: bambooit_nginx
    profiles: ["standalone-proxy"]
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - blog_images:/usr/share/nginx/blog-images:ro
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  blog_images:
